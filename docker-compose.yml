services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emotionflow-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://emotionflow:emotionflow_secret@postgres:5432/emotionflow
      - SYNC_DATABASE_URL=postgresql+psycopg2://emotionflow:emotionflow_secret@postgres:5432/emotionflow
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=change-me-in-production-use-openssl-rand-hex-32
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - MAX_UPLOAD_SIZE_MB=50
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=development
    volumes:
      - ./app:/app/app
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - emotionflow-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: emotionflow-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://emotionflow:emotionflow_secret@postgres:5432/emotionflow
      - SYNC_DATABASE_URL=postgresql+psycopg2://emotionflow:emotionflow_secret@postgres:5432/emotionflow
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=development
      - MODEL_TIER=balanced
    volumes:
      - ./app:/app/app
      - upload_data:/app/uploads
      - model_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - emotionflow-net

  postgres:
    image: postgres:16-alpine
    container_name: emotionflow-postgres
    environment:
      POSTGRES_USER: emotionflow
      POSTGRES_PASSWORD: emotionflow_secret
      POSTGRES_DB: emotionflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emotionflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - emotionflow-net

  redis:
    image: redis:7-alpine
    container_name: emotionflow-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - emotionflow-net

volumes:
  postgres_data:
  redis_data:
  upload_data:
  model_cache:

networks:
  emotionflow-net:
    driver: bridge
