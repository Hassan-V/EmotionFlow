events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Upload size limit — match backend 50MB
    client_max_body_size 55M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream api_backend {
        server api:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # HTTP → redirect to HTTPS
    server {
        listen 80;
        server_name emotionflow.site www.emotionflow.site dev.emotionflow.site;
        return 301 https://$host$request_uri;
    }

    # ── PRODUCTION domain: coming soon page ──────────────────────
    server {
        listen 443 ssl;
        server_name emotionflow.site www.emotionflow.site;

        ssl_certificate     /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;

        root /etc/nginx/coming-soon;
        index index.html;

        location / {
            try_files $uri /index.html;
        }
    }

    # ── DEV domain: full app, password protected ──────────────────
    server {
        listen 443 ssl;
        server_name dev.emotionflow.site;

        ssl_certificate     /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Basic auth — protects the entire dev environment
        auth_basic "EmotionFlow Dev";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Bypass basic auth for WebSocket (browsers don't send basic auth on WS upgrade)
        location /api-backend/ws/ {
            auth_basic off;
            rewrite ^/api-backend/(.*)$ /$1 break;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Block internal worker endpoints from public access
        location /api-backend/internal/ {
            return 403;
        }

        # FastAPI backend
        location /api-backend/ {
            rewrite ^/api-backend/(.*)$ /$1 break;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Auth endpoints — tighter rate limit
            location ~ ^/api-backend/(auth/login|auth/register) {
                rewrite ^/api-backend/(.*)$ /$1 break;
                limit_req zone=auth burst=5 nodelay;
                proxy_pass http://api_backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }

        # FastAPI docs
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # Next.js frontend (everything else)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Static Next.js assets — cache aggressively
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
